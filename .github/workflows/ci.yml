name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional vX.Y.Z package rehearsal; manual runs never publish'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py preflight --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - uses: ./.github/actions/setup-recto
      - name: Test and validate distribution
        id: checks
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || '' }}
        run: python scripts/ci.py --tag "$RELEASE_TAG"
      - name: Save validated packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ steps.checks.outputs.bundle }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Download the uploaded distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: output/recto/ci/roundtrip
      - name: Verify artifact transport
        env:
          RELEASE_TAG: ${{ steps.checks.outputs.tag }}
          VALIDATED_BUNDLE: ${{ steps.checks.outputs.bundle }}
        run: |
          python scripts/release.py verify --tag "$RELEASE_TAG" --dist output/recto/ci/roundtrip
          cmp "$VALIDATED_BUNDLE/SHA256SUMS" output/recto/ci/roundtrip/SHA256SUMS
      - name: Save consumer export evidence
        if: always() && steps.checks.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-exports
          path: ${{ steps.checks.outputs.evidence }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  publish:
    name: Publish verified tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - name: Publish and synchronize Marketplace version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
